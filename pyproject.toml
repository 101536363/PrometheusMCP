[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prometheus-mcp"
version = "0.1.0"
description = "MCP Server for Prometheus metrics querying and management"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Prometheus MCP Team" }
]
dependencies = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/prometheus_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
